name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # This is the actual gate: a broken production build should never
      # reach main unnoticed again, the way one did before CI existed.
      - name: Build
        run: npm run build
        env:
          # Placeholder values so build-time env access doesn't crash the
          # build. No real secrets are needed to compile the app.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ADMIN_SESSION_SECRET: placeholder-ci-secret-not-used-in-production

      # Informational only for now: the codebase has pre-existing lint
      # findings unrelated to this workflow's changes. Not blocking CI on
      # them yet avoids failing every PR on unrelated debt; they're worth
      # a dedicated cleanup pass later.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
