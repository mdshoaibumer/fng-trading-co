name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22+: @supabase/supabase-js's realtime client needs Node's native
          # WebSocket; on Node 20 importing src/lib/supabase.ts throws and the
          # test files that load it crash.
          node-version: 22
          cache: npm

      - run: npm ci

      # This is the actual gate: a broken production build should never
      # reach main unnoticed again, the way one did before CI existed.
      - name: Build
        run: npm run build
        env:
          # Placeholder values so build-time env access doesn't crash the
          # build. No real secrets are needed to compile the app.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ADMIN_SESSION_SECRET: placeholder-ci-secret-not-used-in-production

      # Blocking: the codebase lints clean (0 errors, 0 warnings).
      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
